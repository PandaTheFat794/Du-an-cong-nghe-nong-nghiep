<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tư vấn Nông nghiệp - Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-body">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <h1>Tư vấn Nông nghiệp</h1>
      <p class="login-sub">Chat trực tiếp với chuyên gia, kết nối đơn vị đồng hành</p>

      <div class="tabs">
        <button class="tab active" id="tabLogin" type="button">Đăng nhập</button>
        <button class="tab" id="tabRegister" type="button">Đăng ký</button>
      </div>

      <form id="loginForm">
        <input class="form-field" type="text" id="loginUsername" placeholder="Tên đăng nhập" autocomplete="username" required>
        <input class="form-field" type="password" id="loginPassword" placeholder="Mật khẩu" autocomplete="current-password" required>
        <button class="btn-primary" type="submit">Đăng nhập</button>
      </form>

      <form id="registerForm" hidden>
        <input class="form-field" type="text" id="regDisplayName" placeholder="Họ và tên" required>
        <input class="form-field" type="text" id="regUsername" placeholder="Tên đăng nhập" autocomplete="username" required>
        <input class="form-field" type="password" id="regPassword" placeholder="Mật khẩu" autocomplete="new-password" required>
        <button class="btn-primary" type="submit">Đăng ký</button>
      </form>

      <div class="auth-error" id="authError" hidden></div>

      <p class="login-hint">Tài khoản test: admin/admin123 · partner1/admin123 · user1/user123</p>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
