<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang tư vấn nông nghiệp</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="root">
    <!-- Screens sẽ thay đổi theo role qua JavaScript -->
    <div id="login-screen">
      <div class="admin-sidebar" style="display:none;">
        <div class="admin-header">
          <h1>Quản trị viên</h1>
          <span class="user-name" id="adminName"></span>
        </div>
        <div class="user-list" id="adminUserList">
          <!-- Động tạo bằng JS -->
        </div>
      </div>
      <div class="chat-area" style="display:none;">
        <div class="chat-header">
          <h2>Khung chat</h2>
          <div class="chat-controls">
            <button class="chat-btn" id="connectPartnerBtn">Kết nối partner</button>
          </div>
        </div>
        <div class="messages-area" id="messagesArea">
          <!-- Động tạo -->
        </div>
        <div class="input-area">
          <input class="input-field" id="msgInput" type="text" placeholder="Nhập tin nhắn..." disabled>
          <button class="input-btn" id="sendBtn" disabled>Gửi</button>
        </div>
      </div>
      <div class="connect-partner" id="connectPartnerDesktopBtn">Kết nối partner</div>
    </div>

    <div id="partner-screen" style="display:none;">
      <div class="partner-sidebar">
        <div class="partner-header">
          <h1>Lộ trình tư vấn</h1>
          <span class="user-name" id="partnerUserName"></span>
        </div>
        <div class="partner-list" id="partnerList">
          <!-- Khách gán cho partner -->
        </div>
      </div>
      <div class="chat-view">
        <div class="partner-messages" id="partnerMessages">
          <!-- Đọc-only lịch sử -->
          <div class="no-partner" id="noPartnerMsg">Chưa có khách gán</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/partner.js"></script>
</body>
</html>
