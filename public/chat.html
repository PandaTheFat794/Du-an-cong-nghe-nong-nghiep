<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tư vấn Nông nghiệp - Chat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-account-controls="headerControls">
  <div id="root">
    <div class="chat-area">
      <div class="chat-header">
        <h2>Chuyên gia tư vấn</h2>
        <div class="chat-controls" id="headerControls">
          <span class="partner-chip" id="partnerChip" hidden></span>
          <button class="chat-btn" id="logoutBtn" type="button">Đăng xuất</button>
        </div>
      </div>
      <div class="messages-area" id="messagesArea"></div>
      <div class="attach-chip" id="attachChip"></div>
      <div class="input-area">
        <button class="attach-btn" id="attachBtn" type="button" title="Gửi ảnh / tài liệu">+</button>
        <input type="file" id="attachInput" hidden accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx">
        <input class="input-field" id="msgInput" type="text" placeholder="Nhập tin nhắn..." autocomplete="off">
        <button class="input-btn" id="sendBtn">Gửi</button>
      </div>
      <div class="socket-status" id="socketStatus" hidden></div>
    </div>
  </div>

  <script src="/ws/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
