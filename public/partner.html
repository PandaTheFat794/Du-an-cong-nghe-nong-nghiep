<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tư vấn Nông nghiệp - Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-partner" data-account-controls="headerControls">
  <div id="root">
    <div class="partner-sidebar">
      <div class="partner-header">
        <h1>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
          Lộ trình tư vấn
        </h1>
        <span class="user-name" id="partnerName"></span>
        <div class="chat-controls" id="headerControls"></div>
      </div>
      <div class="partner-list" id="partnerList"></div>
      <button class="chat-btn partner-logout" id="logoutBtn" type="button">Đăng xuất</button>
    </div>

    <div class="chat-view partner-view">
      <header class="partner-topbar">
        <div class="partner-customer">
          <span class="status-dot" id="connDot"></span>
          <div class="partner-customer-text">
            <h2 id="partnerChatTitle">Chọn một khách hàng</h2>
            <p id="partnerChatMeta">Theo dõi quá trình canh tác và trao đổi trực tiếp</p>
          </div>
        </div>
        <div class="view-tabs" id="viewTabs" role="tablist" aria-label="Chế độ xem khách hàng" hidden>
          <button class="view-tab active" data-view="process" role="tab" aria-selected="true" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
            Nhật ký canh tác
          </button>
          <button class="view-tab" data-view="customer" role="tab" aria-selected="false" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5Z"/></svg>
            Nhắn khách hàng
          </button>
          <button class="view-tab" data-view="admin" role="tab" aria-selected="false" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Nhắn admin
          </button>
        </div>
      </header>

      <div class="partner-stage">
        <div class="no-partner partner-empty" id="noPartnerMsg">
          <h3>Chưa có khách hàng nào được gán</h3>
          <p>Khi admin kết nối bạn với một khách hàng, nhật ký canh tác và cuộc trò chuyện sẽ xuất hiện tại đây.</p>
        </div>

        <section class="process-pane" id="processPane" hidden>
          <div class="process-toolbar">
            <span class="process-live"><i></i>Cập nhật realtime khi khách ghi nhật ký</span>
            <button class="chat-btn" id="refreshProcessBtn" type="button">Làm mới</button>
          </div>
          <div class="process-timeline partner-process" id="processTimeline"></div>
        </section>

        <section class="chat-pane" id="chatPane" hidden>
          <button class="load-more" id="loadMoreBtn" type="button" hidden>Tải tin cũ hơn</button>
          <div class="messages-area" id="partnerMessages"></div>
          <div class="attach-chip" id="attachChip"></div>
          <div class="input-area">
            <button class="attach-btn" id="attachBtn" type="button" title="Gửi ảnh / tài liệu" aria-label="Gửi ảnh hoặc tài liệu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input type="file" id="attachInput" hidden accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx">
            <input class="input-field" id="msgInput" type="text" placeholder="Nhắn riêng cho khách hàng..." autocomplete="off">
            <button class="input-btn" id="sendBtn">Gửi
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="/ws/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/process.js"></script>
  <script src="/js/partner.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
