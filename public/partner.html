<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tư vấn Nông nghiệp - Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-account-controls="headerControls">
  <div id="root">
    <div class="partner-sidebar">
      <div class="partner-header">
        <h1>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
          Lộ trình tư vấn
        </h1>
        <span class="user-name" id="partnerName"></span>
        <div class="chat-controls" id="headerControls"></div>
      </div>
      <div class="partner-list" id="partnerList"></div>
      <button class="chat-btn partner-logout" id="logoutBtn" type="button">Đăng xuất</button>
    </div>
    <div class="chat-view">
      <button class="load-more" id="loadMoreBtn" type="button" hidden>Tải tin cũ hơn</button>
      <div class="partner-messages" id="partnerMessages">
        <div class="no-partner" id="noPartnerMsg">Chưa có khách hàng nào được gán cho bạn</div>
      </div>
    </div>
  </div>

  <script src="/ws/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/partner.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
