<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tư vấn Nông nghiệp - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-account-controls="headerControls">
  <div id="root">
    <div class="admin-sidebar">
      <div class="admin-header">
        <h1>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Quản trị viên
        </h1>
        <span class="user-name" id="adminName"></span>
      </div>
      <div class="user-list" id="adminUserList"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <h2><span class="status-dot" id="connDot"></span><span id="chatTitle">Chọn một khách hàng để tư vấn</span></h2>
        <div class="chat-controls" id="headerControls">
          <select class="partner-select" id="partnerSelect" hidden aria-label="Chọn Partner"></select>
          <button class="chat-btn" id="connectPartnerBtn" hidden type="button">Kết nối Partner</button>
          <button class="chat-btn" id="logoutBtn" type="button">Đăng xuất</button>
        </div>
      </div>
      <div class="messages-area" id="messagesArea">
        <div class="no-partner" id="emptyChatHint">Chưa chọn cuộc trò chuyện</div>
      </div>
      <div class="attach-chip" id="attachChip"></div>
      <div class="input-area">
        <button class="attach-btn" id="attachBtn" type="button" title="Gửi ảnh / tài liệu" aria-label="Gửi ảnh hoặc tài liệu" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input type="file" id="attachInput" hidden accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx">
        <input class="input-field" id="msgInput" type="text" placeholder="Nhập tin nhắn..." autocomplete="off" disabled>
        <button class="input-btn" id="sendBtn" disabled>Gửi
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/ws/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/account.js"></script>
</body>
</html>
